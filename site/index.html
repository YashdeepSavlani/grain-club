<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Grain Club</title>
<meta name="description" content="Grain Club: a retro film and digicam camera.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grain Club">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Grain Club interface.
   Direction: dark, neutral editor chrome so the film colours are judged against black, never against a tinted UI;
   a strip of live look previews as the one vivid element; a single amber accent borrowed from the camera's own date stamp;
   monospace capitals for readouts, system sans for everything you read or press. */
:root{
  color-scheme:dark;
  /* surfaces */
  --bg:#000; --surface-1:#121214; --surface-2:#1c1c1f; --surface-3:#28282c;
  --fill:rgba(255,255,255,.08); --fill-strong:rgba(255,255,255,.18); --hairline:rgba(255,255,255,.12);
  --glass:rgba(18,18,20,.62); --scrim:rgba(0,0,0,.55);
  /* content */
  --text:#f6f3ec; --text-2:#a8a59e; --text-3:#6e6c67;
  /* accent and status */
  --accent:#ffb224; --on-accent:#1b1300; --accent-soft:rgba(255,178,36,.16);
  --rec:#ff453a; --on-rec:#fff; --danger:#ff6a5e; --danger-soft:rgba(255,69,58,.16);
  /* shape, space, icon */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --ic:22px; --th:56px;
  /* motion: a press is quicker than a state change, and things leave faster than they arrive */
  --t-press:110ms; --t-state:180ms; --t-enter:300ms; --t-exit:190ms;
  --ease:cubic-bezier(.25,.1,.25,1); --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.4,0,1,1);
  /* type */
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono","Liberation Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation;transition:transform var(--t-press) var(--ease),opacity var(--t-press) var(--ease),background-color var(--t-state) var(--ease),color var(--t-state) var(--ease)}
button:active{opacity:.72}
button:disabled{opacity:.38;pointer-events:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
svg{display:block}
.ic{width:var(--ic);height:var(--ic);flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.solid{fill:currentColor}
.mono{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em}

#app{position:relative;width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding-inline:env(safe-area-inset-left,0px) env(safe-area-inset-right,0px)}

/* top bar: tools either side, the loaded camera in the middle */
.bar{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) 6px;flex:none}
.tools{display:flex;flex:none}
.ib{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--text)}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.readout{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.readout b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:17px;font-weight:600}
.readout span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:11px;line-height:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);font-variant-numeric:tabular-nums}
.readout span.rec{padding:0 7px;border-radius:5px;background:var(--rec);color:var(--on-rec);font-weight:600}
.readout span.warn{color:var(--accent)}

/* viewfinder */
.vf{position:relative;flex:1 1 0;min-width:0;min-height:150px;margin:0 var(--s2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;line-height:0;flex:none;touch-action:none}
#view{display:block;border-radius:10px;cursor:crosshair}
.gridl{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 0 1px rgba(0,0,0,.8));background:
  linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)) 33.333% 0/1px 100% no-repeat,
  linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)) 66.666% 0/1px 100% no-repeat,
  linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)) 0 33.333%/100% 1px no-repeat,
  linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)) 0 66.666%/100% 1px no-repeat}
.flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:10px}
.flashfx.go{animation:fl .38s var(--ease)}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.lvl{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lvl::before,.lvl::after{content:"";position:absolute;top:calc(50% - 1px);width:9%;height:2px;background:var(--text);box-shadow:0 0 2px #000}
.lvl::before{left:7%}.lvl::after{right:7%}
.lvl i{display:block;width:58%;height:2px;background:var(--text);box-shadow:0 0 3px #000;transform:rotate(var(--a,0deg));transition:transform .08s linear,background-color var(--t-state) var(--ease)}
.lvl.ok i{background:var(--accent)}
.lvl.flat i{opacity:.35}
.lvl b{position:absolute;top:calc(50% + 12px);font-family:var(--f-mono);font-weight:600;font-size:12px;line-height:1;letter-spacing:.06em;color:var(--text);text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
.lvl.ok b{color:var(--accent)}
.foc{position:absolute;z-index:1;width:0;height:0;pointer-events:none}
.foc .box{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border:1.5px solid var(--accent);border-radius:6px;box-shadow:0 0 0 .5px rgba(0,0,0,.5);animation:focin var(--t-enter) var(--ease-out)}
.evs{position:absolute;left:46px;top:-66px;width:30px;height:132px}
.foc.flip .evs{left:auto;right:46px}
.evs::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:1.5px;border-radius:1px;background:var(--accent);box-shadow:0 0 2px rgba(0,0,0,.7);opacity:.45;transition:opacity var(--t-state) var(--ease)}
.foc.drag .evs::before{opacity:.95}
.evs .sun{position:absolute;left:0;top:calc(50% - 15px - var(--ev,0)*25%);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.55);color:var(--accent)}
.evs .sun .ic{--ic:19px;stroke-width:2}
.evs b{position:absolute;left:50%;top:calc(50% - 34px - var(--ev,0)*25%);transform:translateX(-50%);padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.55);font-family:var(--f-mono);font-size:12px;font-weight:600;line-height:1.3;letter-spacing:.02em;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
@keyframes focin{0%{transform:scale(1.4);opacity:.3}100%{transform:scale(1);opacity:1}}
.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:140px;color:var(--text);text-shadow:0 2px 24px #000;pointer-events:none;font-variant-numeric:tabular-nums}
.pillb{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);box-shadow:inset 0 0 0 1px var(--hairline);color:var(--text);font-size:14px;font-weight:600;white-space:nowrap}
.pillb::after{content:"";position:absolute;inset:-4px}
.pillb.go{background:var(--accent);color:var(--on-accent);box-shadow:none}
.pillb .ic{--ic:16px;stroke-width:2.2}
#closePhoto{left:12px;top:12px}
#aeBtn{right:12px;top:12px;gap:5px;padding:0 10px 0 9px;font-family:var(--f-mono);font-size:13px;letter-spacing:.02em;color:var(--accent);font-variant-numeric:tabular-nums}
#aeBtn .ic:last-child{color:var(--text-2)}
.tag{left:10px;top:10px}
#saveLook{right:12px;top:12px}
.tag{position:absolute;z-index:2;padding:5px 9px;border-radius:6px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-family:var(--f-mono);font-size:11px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:var(--text);pointer-events:none}
.say{position:absolute;z-index:2;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 120px);margin:0;padding:8px 14px;border-radius:var(--r-sm);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);box-shadow:inset 0 0 0 1px var(--hairline);color:var(--text);font-size:13px;line-height:1.35;text-align:center;pointer-events:none;animation:fadeUp var(--t-enter) var(--ease-out)}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.zoomc{position:absolute;z-index:2;right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:4px;padding:4px;border-radius:var(--r-pill);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);box-shadow:inset 0 0 0 1px var(--hairline)}
.zoomc button{position:relative;width:38px;height:38px;padding:0;border-radius:50%;color:var(--text);font-family:var(--f-mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.zoomc button::after{content:"";position:absolute;inset:-3px -5px}
.zoomc button.on{background:rgba(0,0,0,.5);color:var(--accent)}
#app.sheeting .zoomc{display:none}
.standby{position:absolute;z-index:1;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s2);padding:var(--s5);text-align:center;pointer-events:none}
.standby b{font-size:17px;font-weight:600}
.standby span{max-width:26ch;font-size:14px;line-height:1.4;color:var(--text-2)}
.standby .btn{margin-top:var(--s2);pointer-events:auto}
.standby .ic{--ic:28px;color:var(--text-2);stroke-width:1.5}
.spin{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--fill-strong);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* look strip: every camera previewed on what the lens sees */
.cams{display:flex;align-items:flex-start;gap:10px;min-width:0;overflow-x:auto;padding:10px 18px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent)}
.cams::-webkit-scrollbar{display:none}
.cam{flex:none;display:grid;justify-items:center;gap:6px;min-width:calc(var(--th) + 8px);padding:3px 2px 0}
.cam:active{opacity:1}
.cam .th{position:relative;width:var(--th);height:var(--th);border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--c1,#444),var(--c2,#333) 55%,var(--c3,#222));box-shadow:inset 0 0 0 1px var(--hairline);outline:2px solid transparent;outline-offset:2px;transition:transform var(--t-press) var(--ease),outline-color var(--t-state) var(--ease)}
.cam:active .th{transform:scale(.94)}
.cam canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity .35s var(--ease)}
.cam.ready canvas{opacity:1}
.cam .nm{font-size:11px;line-height:14px;font-weight:500;color:var(--text-2);white-space:nowrap;transition:color var(--t-state) var(--ease)}
.cam.on .th{outline-color:var(--accent)}
.cam.on .nm{color:var(--text);font-weight:600}
.cam:focus-visible{outline:none}
.cam:focus-visible .th{outline-color:var(--text)}
.glab{flex:none;align-self:flex-start;height:calc(var(--th) + 6px);padding:3px 0 0;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-family:var(--f-mono);font-size:10px;line-height:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);white-space:nowrap}
.glab:not(:first-child){margin-left:6px}

/* modes */
.modes{display:flex;justify-content:center;gap:var(--s2);padding:0 var(--s4);flex:none}
.mode{position:relative;height:40px;padding:0 12px;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2)}
.mode::before{content:"";position:absolute;inset:-2px 0}
.mode::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent);opacity:0;transform:scale(.4);transition:opacity var(--t-state) var(--ease),transform var(--t-state) var(--ease-out)}
.mode.on{color:var(--accent)}
.mode.on::after{opacity:1;transform:none}
#app.sheeting .modes{display:none}

/* shutter row */
.fire{display:flex;align-items:center;justify-content:space-between;padding:6px 32px 16px;flex:none}
.thumb{position:relative;width:50px;height:50px;flex:none;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--surface-2) center/cover no-repeat;box-shadow:inset 0 0 0 1px var(--hairline);color:var(--text-2)}
.thumb.has .ic{display:none}
.thumb .badge{position:absolute;right:-6px;top:-6px;min-width:22px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.shutter{width:74px;height:74px;flex:none;border-radius:50%;border:3px solid var(--text);padding:4px}
.shutter:active{opacity:1}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:var(--text);transition:transform var(--t-press) var(--ease),border-radius var(--t-state) var(--ease),background-color var(--t-state) var(--ease)}
.shutter:active i{transform:scale(.9)}
.shutter.busy i{background:var(--accent)}
.shutter.video i{background:var(--rec)}
.shutter.video.rec i{border-radius:24%;transform:scale(.5)}
.shutter:focus-visible{outline-offset:5px}
.round{width:50px;height:50px;flex:none;border-radius:50%;background:var(--fill);display:grid;place-items:center}

/* panels take the place of the camera rows, so the whole picture stays visible while adjusting */
.sheet{flex:none;height:48%;min-height:260px;max-height:440px;margin-top:var(--s2);background:var(--surface-1);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:inset 0 1px 0 var(--hairline);display:flex;flex-direction:column;animation:sheetUp var(--t-enter) var(--ease-out)}
.sheet.out{animation:sheetDown var(--t-exit) var(--ease-in) forwards}
@keyframes sheetUp{from{transform:translateY(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetDown{to{transform:translateY(24px);opacity:0}}
#app.sheeting .cams,#app.sheeting .fire{display:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--fill-strong);margin:8px auto 0;flex:none}
.shead{display:flex;align-items:center;gap:6px;padding:6px 6px 8px 16px;flex:none}
.tabs,.gtabs{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.tabs{flex:1;min-width:0}
.tab{flex:1;min-width:0;height:34px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap}
.tab.on{background:var(--surface-3);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 0 0 1px var(--hairline)}
h2{flex:1;min-width:0;margin:0;font-size:17px;font-weight:600;text-wrap:balance}
.textbtn{flex:none;min-height:44px;padding:0 12px;font-size:16px;font-weight:600;color:var(--accent);border-radius:10px}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 28px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sec{margin:10px 0 -6px 2px;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2)}
.sec:first-child{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
.lab{font-size:13px;color:var(--text-2)}
.sl{display:grid;grid-template-columns:1fr auto;align-items:baseline;min-width:0}
.sl .lab{font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl output{font-family:var(--f-mono);font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.sl.moved output{color:var(--accent)}
.sl input{grid-column:1/-1;width:100%}
input[type=range]{--a:0%;--b:50%;-webkit-appearance:none;appearance:none;height:40px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fill-strong) var(--a),var(--text) var(--a),var(--text) var(--b),var(--fill-strong) var(--b))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:var(--text);box-shadow:0 .5px 4px rgba(0,0,0,.3),0 3px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--fill-strong)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:var(--text)}
.grp{display:flex;flex-direction:column;gap:8px;min-width:0}
.grp>.lab{padding-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:var(--fill);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 0 0 1.5px transparent}
.chip.on{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip .dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px rgba(128,128,128,.5)}
.chips.seg{flex-wrap:nowrap;gap:0;padding:2px;border-radius:10px;background:var(--fill)}
.chips.seg .chip{flex:1;min-width:0;min-height:40px;padding:0 6px;border-radius:8px;background:none;box-shadow:none;font-size:13px;color:var(--text-2);white-space:nowrap}
.chips.seg .chip.on{background:var(--surface-3);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 0 0 1px var(--hairline)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 14px 8px 16px;border-radius:var(--r-sm);background:var(--surface-2);font-size:16px}
.row>span{min-width:0}
.group{display:flex;flex-direction:column;border-radius:var(--r-sm);overflow:hidden}
.group .row{border-radius:0}
.group .row+.row{box-shadow:inset 0 1px 0 var(--hairline)}
.switch{position:relative;width:52px;height:32px;flex:none;border-radius:16px;background:var(--fill-strong);transition:background-color var(--t-state) var(--ease)}
.switch::before{content:"";position:absolute;inset:-6px 0}
.switch:active{opacity:1}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:var(--text);box-shadow:0 2px 5px rgba(0,0,0,.35);transition:transform var(--t-state) var(--ease-out)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r-pill);background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600}
.btn.lite{background:var(--fill);color:var(--text);font-weight:500}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{margin:0;padding:0 2px;font-size:13px;line-height:1.45;color:var(--text-2);-webkit-user-select:text;user-select:text}
.note b{color:var(--text);font-weight:600}
.field{font:inherit;font-size:16px;padding:12px 14px;border-radius:var(--r-sm);border:0;background:var(--surface-2);color:var(--text);min-width:0;width:100%;box-shadow:inset 0 0 0 1px var(--hairline);-webkit-user-select:text;user-select:text}
.field::placeholder{color:var(--text-2)}
textarea.field{font-family:var(--f-mono);font-size:12px;min-height:68px;resize:none;word-break:break-all}
.rcp{display:flex;align-items:center;gap:8px;padding:8px 2px;box-shadow:inset 0 1px 0 var(--hairline)}
.rcp b{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px;font-weight:500}

/* roll and photo view */
.over{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:overIn var(--t-enter) var(--ease-out)}
.over.out{animation:overOut var(--t-exit) var(--ease-in) forwards}
@keyframes overIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes overOut{to{opacity:0;transform:translateY(12px)}}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;min-height:48px;padding:0 6px;flex:none}
.nav h2{text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navb{justify-self:start;display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 4px;border-radius:10px;font-size:16px;font-weight:500;color:var(--accent)}
.navb.end{justify-self:end;gap:5px;padding:0 10px}
.navb .ic{--ic:20px;stroke-width:2.1}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2)}
.ghead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 16px 12px;flex:none}
.ghead>div{min-width:0}
.ghead .count{margin-top:6px}
.selbtn{position:relative;flex:none;min-height:34px;padding:0 15px;margin-bottom:2px;border-radius:var(--r-pill);background:var(--fill);font-size:14px;font-weight:600;color:var(--text)}
.selbtn::after{content:"";position:absolute;inset:-5px -2px}
.selbar{display:flex;align-items:center;gap:8px;padding:10px 12px 12px;background:var(--surface-1);box-shadow:inset 0 1px 0 var(--hairline);flex:none;animation:sheetUp var(--t-enter) var(--ease-out)}
.selbar .grow{flex:1}
.selbar .btn{padding:0 16px}
.selbar .btn .ic{--ic:18px}
.selbar .navb{padding:0 8px}
.btn.lite.danger{color:var(--danger)}
.btn.lite.danger.warn{background:var(--danger-soft);font-weight:600}
.large{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.015em}
.count{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);font-variant-numeric:tabular-nums}
.gtabs{margin:0 16px 12px;flex:none}
.gbody{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 32px;display:flex;flex-direction:column;gap:24px;-webkit-overflow-scrolling:touch}
.card{background:var(--surface-1);border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--hairline);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card p{margin:0;flex:1 1 180px;min-width:0;font-size:16px;line-height:1.35}
.card .k{display:block;margin-bottom:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.day h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.day p{margin:3px 0 10px;font-size:13px;color:var(--text-2)}
.gridp{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-radius:var(--r-sm);overflow:hidden}
.gridp button{aspect-ratio:1;max-width:100%;background:var(--surface-2) center/cover no-repeat;position:relative}
.gridp button:focus-visible{outline-offset:-3px}
.gridp button.fav::after{content:"";position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.gridp button.vid::before{content:"\25B8  " attr(data-dur);position:absolute;left:6px;bottom:6px;padding:2px 7px;border-radius:9px;background:rgba(0,0,0,.65);color:#fff;font-family:var(--f-mono);font-size:11px;font-weight:600;line-height:1.4;font-variant-numeric:tabular-nums}
.gridp.reveal button{animation:dev 1.4s ease-out}
.gridp .ck{display:none;position:absolute;right:6px;bottom:6px;width:24px;height:24px;place-items:center;border-radius:50%;border:1.5px solid #fff;background:rgba(0,0,0,.28);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.gridp .ck .ic{--ic:14px;stroke-width:3;color:var(--on-accent);opacity:0}
.gridp button.pick .ck{display:grid}
.gridp button.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.gridp button.sel .ck{background:var(--accent);border-color:var(--accent)}
.gridp button.sel .ck .ic{opacity:1}
@keyframes dev{0%{filter:brightness(0) sepia(1)}60%{filter:brightness(.6) sepia(.6)}100%{filter:none}}
.empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:var(--s3);text-align:center;color:var(--text-2);font-size:16px;line-height:1.4;max-width:28ch}
.empty .ic{--ic:34px;stroke-width:1.4;color:var(--text-3)}
.empty b{color:var(--text);font-size:18px;font-weight:600}
.empty .btn{margin-top:var(--s2)}
.dimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px 8px}
.dimg video{max-width:100%;max-height:100%;border-radius:10px;background:#000}
.dimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.dinfo{padding:4px 16px 0;font-family:var(--f-mono);font-size:12px;line-height:1.6;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);flex:none;font-variant-numeric:tabular-nums}
.dact{display:flex;flex-direction:column;gap:10px;padding:12px 16px 18px;flex:none}
.dact .btn{width:100%;min-height:50px;font-size:16px}
.acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:60px;padding:8px 4px;border-radius:var(--r-sm);background:var(--surface-2);font-size:12px;font-weight:500;line-height:1.2;color:var(--text);text-align:center}
.act .ic{--ic:20px}
.act.on{color:var(--accent)}
.act.on .ic{fill:currentColor}
.act.danger{color:var(--danger)}
.act.warn{background:var(--danger-soft);color:var(--danger);font-weight:600}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);padding:11px 18px;border-radius:var(--r-lg);background:rgba(40,40,44,.94);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 8px 28px rgba(0,0,0,.5),inset 0 0 0 1px var(--hairline);color:var(--text);font-size:15px;font-weight:500;line-height:1.3;text-align:center;animation:toastIn var(--t-enter) var(--ease-out)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

/* short screens: tighten the rows before the picture gives anything up */
@media (max-height:640px){
  :root{--th:48px}
  .cams{padding-top:6px}
  .mode{height:36px}
  .fire{padding:2px 32px 10px}
  .shutter{width:66px;height:66px}
}
@media (max-width:350px){.readout span{display:none}.fire{padding-inline:22px}}
/* phone held sideways: picture on the left, controls in a column on the right */
@media (orientation:landscape) and (max-height:520px){
  #app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) min(380px,48%);grid-template-rows:auto minmax(0,1fr) auto auto}
  .bar{grid-column:2;grid-row:1}
  .vf{grid-column:1;grid-row:1/-1;margin:var(--s2)}
  .cams{grid-column:2;grid-row:2;align-self:center}
  .modes{grid-column:2;grid-row:3}
  .fire{grid-column:2;grid-row:4;padding:2px 28px 10px}
  .sheet{grid-column:2;grid-row:2/-1;height:auto;min-height:0;max-height:none;margin-top:0}
  .shutter{width:62px;height:62px}
  .mode{height:34px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.spin{animation:none!important;border-top-color:var(--fill-strong)}}
</style>

<script>
/* ---------- Film engine: one WebGL pass for the look, 2D canvas for frames and date stamps ---------- */
const GC_VERT = 'attribute vec2 aP;varying vec2 vUv;void main(){vUv=aP*0.5+0.5;gl_Position=vec4(aP,0.0,1.0);}';
const GC_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uT1,uT2;
uniform vec4 uC1,uC2;
uniform vec2 uRes;
uniform float uPx,uSeed,uLS,uHas2,uDip,uDbl;
uniform float uExp,uTemp,uTint,uCon,uSat,uFade,uMono;
uniform vec3 uLift,uGamma,uGain,uShT,uHiT,uMonoTint;
uniform mat3 uMat;
uniform float uGrain,uGsize,uChroma,uDust,uLeak,uHal,uBloom,uVig,uCA,uSplit,uSharp,uScan,uVhs;
uniform float uFish,uPrism,uStar,uKal,uFlash,uFlashTint;
uniform vec3 uFlashCol;

float h12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec2 mir(vec2 u){return 1.0-abs(1.0-mod(u,2.0));}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(h12(i),h12(i+vec2(1.,0.)),f.x),mix(h12(i+vec2(0.,1.)),h12(i+vec2(1.,1.)),f.x),f.y);}

vec3 src(vec2 u){
  u=mir(u);
  if(uDip>0.5){
    float rt=step(0.5,u.x);
    float x=(u.x-0.5*rt)*2.0;
    x=(x-0.014)/0.972;
    if(x<0.0||x>1.0) return vec3(0.015);
    vec2 v=vec2(x,u.y);
    if(rt<0.5&&uHas2>0.5) return texture2D(uT2,v*uC2.xy+uC2.zw).rgb;
    return texture2D(uT1,v*uC1.xy+uC1.zw).rgb;
  }
  vec3 c=texture2D(uT1,u*uC1.xy+uC1.zw).rgb;
  if(uDbl>0.5&&uHas2>0.5){vec3 d=texture2D(uT2,u*uC2.xy+uC2.zw).rgb;c=1.0-(1.0-c*0.8)*(1.0-d*0.8);}
  return c;
}

void main(){
  float asp=uRes.x/uRes.y;
  vec2 p=vUv-0.5; p.x*=asp;
  float rmax=length(vec2(0.5*asp,0.5));
  float rn0=length(p)/rmax;
  vec2 st=vec2(vUv.x,1.0-vUv.y);

  if(uKal>1.5){float a=atan(p.y,p.x);float r=length(p);float s=6.2831853/uKal;a=mod(a,s);a=abs(a-s*0.5);p=r*vec2(cos(a),sin(a));}
  float rn=length(p)/rmax;
  if(uFish>0.0){p*=(1.0+uFish*rn*rn)/(1.0+uFish);}
  vec2 q=vec2(p.x/asp,p.y)+0.5;

  if(uVhs>0.0){
    float ln=floor(st.y*240.0);
    q.x+=(h12(vec2(ln,uSeed*91.7))-0.5)*0.0028*uVhs;
    float band=smoothstep(0.93,1.0,st.y);
    q.x+=band*(h12(vec2(ln*1.3,uSeed*13.1))-0.5)*0.07*uVhs;
  }

  vec3 c;
  if(uCA+abs(uSplit)>0.0){
    vec2 off=(q-0.5)*rn*uCA*0.014+vec2(uSplit,0.0);
    c.r=src(q+off).r; c.g=src(q).g; c.b=src(q-off).b;
  } else c=src(q);

const DB=(function(){
  let db=null; const mem={meta:new Map(),blobs:new Map()}; const api={volatile:false};
  const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  const done=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error);});
  api.open=()=>new Promise(res=>{
    try{
      const rq=indexedDB.open('grainclub',1);
      rq.onupgradeneeded=()=>{const d=rq.result;if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'id'});if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs',{keyPath:'id'});};
      rq.onsuccess=()=>{db=rq.result;res(true);}; rq.onerror=()=>{api.volatile=true;res(false);}; rq.onblocked=()=>{api.volatile=true;res(false);};
    }catch(e){api.volatile=true;res(false);}
  });
  api.all=async()=>{let out=[];if(db){try{out=await req(db.transaction('meta').objectStore('meta').getAll());}catch(e){}}return out.concat([...mem.meta.values()]);};
  api.put=async(meta,blobs)=>{
    if(db&&!mem.meta.has(meta.id)){
      try{const t=db.transaction(['meta','blobs'],'readwrite');t.objectStore('meta').put(meta);if(blobs)t.objectStore('blobs').put(blobs);await done(t);return true;}catch(e){}
    }
    api.volatile=true; mem.meta.set(meta.id,meta); if(blobs)mem.blobs.set(meta.id,blobs); return false;
  };
  api.blobs=async id=>{if(mem.blobs.has(id))return mem.blobs.get(id);if(!db)return null;try{return await req(db.transaction('blobs').objectStore('blobs').get(id));}catch(e){return null;}};
  api.del=async id=>{mem.meta.delete(id);mem.blobs.delete(id);if(db){try{const t=db.transaction(['meta','blobs'],'readwrite');t.objectStore('meta').delete(id);t.objectStore('blobs').delete(id);await done(t);}catch(e){}}};
  return api;
})();

const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
function makeItem(src,w,h,mirror){
  const max=E.MAXL, k=Math.min(1,max/Math.max(w,h));
  const full=mkCanvas(Math.max(1,Math.round(w*k)),Math.max(1,Math.round(h*k)));
  const x=full.getContext('2d');
  if(mirror){x.translate(full.width,0);x.scale(-1,1);}
  x.drawImage(src,0,0,full.width,full.height);
  const k2=Math.min(1,1280/Math.max(full.width,full.height));
  let prev=full;
  if(k2<1){prev=mkCanvas(Math.round(full.width*k2),Math.round(full.height*k2));prev.getContext('2d').drawImage(full,0,0,prev.width,prev.height);}
  return {full,prev};
}
async function loadFile(file){
  let img=null,url=null;
  try{
    url=URL.createObjectURL(file);
    img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('decode'));im.src=url;});
  }catch(e){img=null;}
  try{
    if(!img&&window.createImageBitmap) img=await createImageBitmap(file);
    if(!img) throw new Error('decode');
    return makeItem(img,img.naturalWidth||img.width,img.naturalHeight||img.height,false);
  } finally { if(url) URL.revokeObjectURL(url); }
}

  const key=view.width+'x'+view.height+'@'+Math.round(r.width)+'x'+Math.round(r.height); if(key===fitKey) return; fitKey=key;
  const k=Math.min(r.width/view.width,r.height/view.height);

    view.width=Math.round(c.width*k); view.height=Math.round(c.height*k);

  }

  if(useLive){A={el:video,w:video.videoWidth,h:video.videoHeight,mirror:S.facing==='user',video:true};if(pair)B=T(pair,'prev');seed=rnd();}

}

let thumbQ=[], thumbBase=null, thumbAt=0, thumbDue=0, tkObj, tkStr='';
function thumbSource(){
  if(liveReady()&&SRC.kind==='sample') return {el:video,w:video.videoWidth,h:video.videoHeight,mirror:S.facing==='user'};
  if((SRC.kind==='photo'||SRC.kind==='held')&&SRC.a) return {el:SRC.a.prev,w:SRC.a.prev.width,h:SRC.a.prev.height};
  if(SRC.kind==='sample'&&!booting&&!camOK&&!live.on) return {el:sampleItem.prev,w:sampleItem.prev.width,h:sampleItem.prev.height};
  return null;

function refreshThumbs(){
  const s=thumbSource(); if(!s||!E) return;
  const c=mkCanvas(192,192), x=c.getContext('2d'), k=Math.min(s.w,s.h);
  if(s.mirror){x.translate(192,0);x.scale(-1,1);}
  try{x.drawImage(s.el,(s.w-k)/2,(s.h-k)/2,k,k,0,0,192,192);}catch(e){return;}
  thumbBase=c; thumbAt=Date.now();
  const all=[...document.querySelectorAll('.cam')], at=Math.max(0,all.findIndex(b=>b.classList.contains('on')));
  thumbQ=all.map((b,i)=>[Math.abs(i-at),b]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]);   // the ones on screen first
}
function thumbTick(){
  if(!E) return;
  const liveSrc=liveReady()&&SRC.kind==='sample';
  const obj=liveSrc?video:(SRC.a&&SRC.a.prev)||null, str=(liveSrc?S.facing:SRC.kind)+(booting||camOK?'c':'n');
  if(obj!==tkObj||str!==tkStr){tkObj=obj;tkStr=str;thumbDue=Date.now()+(liveSrc?450:0);}
  else if(liveSrc&&!REDUCED&&!thumbDue&&!thumbQ.length&&!sheetName&&!galOpen&&!detOpen&&!document.hidden&&Date.now()-thumbAt>6000) thumbDue=Date.now();
  if(busyN||rec||running) return;
  if(thumbDue&&Date.now()>=thumbDue){thumbDue=0;refreshThumbs();}
  const A={el:thumbBase,w:192,h:192};
  for(let i=0;i<3&&thumbQ.length;i++){
    const b=thumbQ.shift(); if(!b.isConnected||!b._rcp) continue;
    try{E.render(b._cv,A,null,resolve(b._rcp()),{long:112,force:{ar:1,land:true},bare:true});b.classList.add('ready');}catch(e){}
  }

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

async function store(a,b,rcp,useRoll){
  const ts=Date.now(), out=mkCanvas(8,8);
  E.render(out,T(a,'full'),b?T(b,'full'):null,resolve(rcp),{ts,n:S.count+1});
  const blob=await toBlob(out); if(!blob) throw new Error('encode');
  const inRoll=!!(useRoll&&S.roll);
  const meta={id:uid(),ts,look:rcp.look,name:(LOOK[rcp.look]||LOOKS[0]).name,rcp,thumb:thumbOf(out),fav:false,w:out.width,h:out.height,kind:'photo',roll:inRoll?S.roll.id:null,hidden:inRoll,orig:false};
  const blobs={id:meta.id,out:blob};
  if(S.keep){blobs.a=await toBlob(a.full,0.9); if(b) blobs.b=await toBlob(b.full,0.9); meta.orig=!!blobs.a;}
  await DB.put(meta,blobs); shots.unshift(meta); S.count++;
  let info={meta,frame:0,size:0,finished:false};
  if(inRoll){S.roll.count++;info.frame=S.roll.count;info.size=S.roll.size;if(S.roll.count>=S.roll.size){info.finished=true;S.roll=S.rollSize?newRoll():null;}}
  saveSettings(); return info;
}
function rollSay(info){
  if(info.finished) msg('Roll finished. Develop it in your roll.',5000);
  else msg('Frame '+info.frame+' of '+info.size+' exposed');
}
async function finishOne(a,b,via){
  const seed=rnd();
  if(via==='import'){SRC={kind:'photo',a,b,seed,saved:false};msg('Pick a camera, then save this look.',4200);return;}
  const info=await store(a,b,liveSnap(seed),true);
  if(info.meta.hidden){if(!live.on)SRC=sampleSrc();rollSay(info);}
  else{if(!live.on)SRC={kind:'photo',a,b,seed,saved:true};msg('Saved to your roll');}
}
async function incoming(items,via){
  if(!items.length) return;
  busy(true);
  try{
    if(S.mode==='booth'){
      for(const it of items) if(booth.length<S.booth.n) booth.push(it);
      if(booth.length>=S.booth.n) await boothFinish();
      else {SRC={kind:'held',a:booth[booth.length-1],b:null,seed:rnd(),saved:true};msg(booth.length+' of '+S.booth.n+' taken');}
      return;
    }
    if(look().dip||S.lens.dbl){
      const q=items.slice();
      if(!pair){pair=q.shift();if(!q.length){if(!live.on)SRC={kind:'held',a:pair,b:null,seed:rnd(),saved:true};msg('1 of 2 exposed. Take the second.',4200);return;}}
      const second=q.shift(), first=pair; pair=null;
      await finishOne(second,first,via); return;
    }
    if(items.length>1){
      let info=null,seed=0;
      for(const it of items){seed=rnd();info=await store(it,null,snap(seed),false);}
      SRC={kind:'photo',a:items[items.length-1],b:null,seed,saved:true};
      msg(items.length+' photos developed and saved',3600); return;
    }
    await finishOne(items[0],null,via);
  }catch(e){console.error(e);msg('That photo could not be developed. Try another.',4200);}
  finally{busy(false);requestDraw();}
}
let chain=Promise.resolve();   // photos are developed one batch at a time, in the order they arrive
function onFiles(input,via){
  const files=[...(input.files||[])].filter(f=>!f.type||f.type.indexOf('image/')===0).slice(0,12); input.value='';
  if(!files.length) return chain;
  busy(true);
  const job=async()=>{
    const items=[];
    try{for(const f of files){try{items.push(await loadFile(f));}catch(e){}}}finally{busy(false);}
    if(!items.length){msg('That file is not a photo this browser can open.',4200);return;}
    await incoming(items,via);
  };
  chain=chain.then(job,job); return chain;
}
async function saveLook(){
  if(SRC.kind!=='photo'||busyN) return;
  busy(true);
  try{await store(SRC.a,SRC.b,snap(SRC.seed),false);SRC.saved=true;click();msg('Saved to your roll');}
  catch(e){msg('Could not save this photo.',4000);}
  finally{busy(false);}
}

/* ---------- photobooth ---------- */
function boothCompose(items,rcp){
  const n=items.length, grid=S.booth.layout==='grid', paper={white:'#f4f1e8',cream:'#e8dcc0',black:'#0c0c0d'}[S.booth.paper], ink=S.booth.paper==='black'?'#e9e5da':'#23221e';
  const fw=grid?640:900, fh=Math.round(fw/BOOTH_AR), m=grid?40:46, gap=grid?22:26, foot=grid?120:140;
  const cols=grid?2:1, rows=Math.ceil(n/cols);
  const W=m*2+cols*fw+(cols-1)*gap, H=m+rows*fh+(rows-1)*gap+foot;
  const out=mkCanvas(W,H), x=out.getContext('2d'), tmp=mkCanvas(8,8);
  x.fillStyle=paper; x.fillRect(0,0,W,H);
  items.forEach((it,i)=>{
    const r=resolve(Object.assign({},rcp,{seed:rnd(),frame:'none',date:Object.assign({},rcp.date,{on:false})}));
    E.render(tmp,T(it,'full'),null,r,{long:fw,force:{ar:BOOTH_AR,land:true},bare:true});
    const px=m+(i%cols)*(fw+gap), py=m+Math.floor(i/cols)*(fh+gap);
    x.drawImage(tmp,px,py,fw,fh);
    x.strokeStyle='rgba(0,0,0,.25)'; x.lineWidth=2; x.strokeRect(px,py,fw,fh);
  });
  const d=new Date(), fy=H-foot/2;
  x.fillStyle=ink; x.textBaseline='middle'; x.textAlign='left';
  x.font='700 '+(grid?28:26)+'px -apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif'; x.fillText('Grain Club',m,fy-14);
  x.font='500 '+(grid?22:20)+'px -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif';
  x.fillText('Photobooth, '+(LOOK[rcp.look]||LOOKS[0]).name,m,fy+22);
  x.textAlign='right'; x.font=(grid?40:36)+'px "VT323","Courier New",monospace';
  x.fillText(p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear(),W-m,fy);
  if(!S.booth.story) return out;
  const st=mkCanvas(1080,1920), y=st.getContext('2d'), dark=S.booth.paper!=='black';
  const g=y.createRadialGradient(540,860,100,540,960,1200);
  if(dark){g.addColorStop(0,'#34312d');g.addColorStop(1,'#131211');}else{g.addColorStop(0,'#f1ece0');g.addColorStop(1,'#cfc8b8');}
  y.fillStyle=g; y.fillRect(0,0,1080,1920);
  const k=Math.min(840/W,1560/H);
  y.save(); y.translate(540,960); y.rotate(-0.045); y.shadowColor='rgba(0,0,0,.5)'; y.shadowBlur=50; y.shadowOffsetY=24;
  y.drawImage(out,-W*k/2,-H*k/2,W*k,H*k); y.restore();
  return st;
}
async function boothFinish(){
  const items=booth; booth=[]; const rcp=liveSnap(rnd());
  const out=boothCompose(items,rcp), blob=await toBlob(out); if(!blob) throw new Error('encode');
  const meta={id:uid(),ts:Date.now(),look:rcp.look,name:look().name+' booth',rcp,thumb:thumbOf(out),fav:false,w:out.width,h:out.height,kind:'booth',roll:null,hidden:false,orig:false};
  await DB.put(meta,{id:meta.id,out:blob}); shots.unshift(meta); S.count++; saveSettings();
  SRC={kind:'result',canvas:out}; msg('Strip saved to your roll',3600);
}

/* ---------- live viewfinder (works where the browser grants the camera) ---------- */
function startLive(quiet){
  if(live.on) return Promise.resolve(true);
  if(starting) return starting;                      // one request at a time, so the phone asks only once
  starting=doStartLive(quiet).then(ok=>{starting=null;return ok;},()=>{starting=null;return false;});
  return starting;
}
async function doStartLive(quiet){
  const fail=()=>{if(!quiet)msg('No live viewfinder here. The shutter opens your phone camera.',5200);return false;};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return fail();
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:S.facing,width:{ideal:1920},height:{ideal:1440}}});
    live.stream=st; video.srcObject=st; try{await video.play();}catch(e){}
    const tr=st.getVideoTracks()[0];
    if(tr) tr.addEventListener('ended',()=>{if(live.stream!==st)return;dropLive();if(wantLive&&document.visibilityState==='visible')startLive(true);});
    live.on=true; camOK=true; tapEV=0; userEV=0; if(SRC.kind==='held'&&S.mode!=='booth') SRC=sampleSrc();
    if(!S.hinted){S.hinted=true;saveSettings();msg('Tap to focus. Slide up or down to change exposure.',5200);}   // shown once, the first time the camera opens
    ui(); requestDraw(); return true;
  }catch(e){ return fail(); }
}
function dropLive(){
  tapEV=0; userEV=0; $('#foc').hidden=true;
  if(live.stream) live.stream.getTracks().forEach(t=>t.stop());
  live.stream=null; live.on=false; video.srcObject=null; ui(); requestDraw();
}
function stopLive(){wantLive=false;dropLive();}
function grabLive(){return makeItem(video,video.videoWidth,video.videoHeight,S.facing==='user');}
function flashFx(){const f=$('#flashfx');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');}
let AC=null;
function click(){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const len=Math.floor(AC.sampleRate*0.1), bf=AC.createBuffer(1,len,AC.sampleRate), d=bf.getChannelData(0);
    for(let i=0;i<len;i++){const k=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-k,3)*((k<0.12||(k>0.45&&k<0.6))?1:0.22);}
    const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
    s.buffer=bf; f.type='bandpass'; f.frequency.value=2600; f.Q.value=0.7; g.gain.value=0.5;
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
  }catch(e){}
}
async function countdown(sec){
  const b=$('#big'); b.hidden=false;
  for(let i=sec;i>0;i--){b.textContent=i;await sleep(1000);if(!live.on)break;}
  b.hidden=true;
}
let running=false;
async function onShutter(){
  if(busyN||running||!E) return;
  if(SRC.kind==='result'){SRC=sampleSrc();ui();requestDraw();}
  if(liveReady()&&SRC.kind!=='sample'){pair=null;SRC=sampleSrc();ui();requestDraw();msg('Back to the viewfinder');return;}
  if(!liveReady()&&camOK&&!starting){wantLive=true;startLive().then(()=>ui());ui();return;}
  if(S.mode==='video'){if(rec)stopRec();else startRec();return;}
  if(!liveReady()){fileCam.setAttribute('capture',S.facing==='user'?'user':'environment');fileCam.click();return;}
  running=true;
  try{
    if(S.mode==='booth'){
      while(booth.length<S.booth.n&&live.on){
        await countdown(3); if(!liveReady()) break;
        const it=grabLive(); flashFx(); click(); booth.push(it); ui();
        if(booth.length<S.booth.n) await sleep(500);
      }
      if(booth.length>=S.booth.n){busy(true);try{await boothFinish();}finally{busy(false);}}
    } else {
      if(S.timer) await countdown(S.timer);
      if(liveReady()){const it=grabLive(); flashFx(); click(); await incoming([it],'live');}
    }
  }catch(e){console.error(e);msg('Something went wrong with that shot.',4000);}
  finally{running=false;ui();requestDraw();}
}

/* ---------- tap to focus and meter, level ---------- */
const EV_GAIN=1/2.2;   // the picture is gamma-encoded, so one stop of light is 2^(1/2.2) on its values, not 2
function liveSnap(seed){const r=snap(seed), e=tapEV+userEV*EV_GAIN;if(live.on)r.lseed=liveLeak;if(e)r.p.exp=clamp(r.p.exp+e,-2.5,2.5);return r;}

/* ---------- video: records the filtered viewfinder exactly as shown ---------- */
function pickMime(){
  const c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const m of c){try{if(MediaRecorder.isTypeSupported(m))return m;}catch(e){}}
  return '';
}
async function startRec(){
  if(rec||busyN) return;
  if(!liveReady()||SRC.kind!=='sample'){msg(camOK?'Starting the camera. Press record again in a moment.':'Video needs the live camera, which is not available here.',3600);if(camOK&&!live.on&&!starting){wantLive=true;startLive(true);}return;}
  if(typeof MediaRecorder==='undefined'||!view.captureStream){msg('This browser cannot record video.',4000);return;}
  rec={starting:true,t0:Date.now()};
  let audio=null;
  if(S.vsound){try{audio=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){audio=null;}}
  let stream,mr; const mime=pickMime();
  try{
    stream=view.captureStream(30);
    if(audio) audio.getAudioTracks().forEach(t=>stream.addTrack(t));
    try{mr=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6e6}:{videoBitsPerSecond:6e6});}catch(e){mr=new MediaRecorder(stream);}
  }catch(e){if(audio)audio.getTracks().forEach(t=>t.stop());rec=null;ui();msg('This browser cannot record video.',4000);return;}
  rec={mr,chunks:[],t0:Date.now(),audio,stream,thumb:thumbOf(view),w:view.width,h:view.height,mime:mr.mimeType||mime||'video/webm',rcp:snap(0),name:look().name};
  mr.ondataavailable=e=>{if(rec&&e.data&&e.data.size)rec.chunks.push(e.data);};
  mr.onstop=finishRec; mr.onerror=()=>stopRec();
  try{mr.start(1000);}catch(e){finishRec();msg('This browser cannot record video.',4000);return;}
  click();
  rec.timer=setInterval(()=>{if(!rec)return;ui();if(Date.now()-rec.t0>=60000){msg('Stopped at the 60 second limit',3000);stopRec();}},250);
  ui(); msg(S.vsound?(audio?'Recording with sound':'Recording without sound. Microphone access was refused.'):'Recording without sound. Turn sound on in Settings.',3200);
}
function stopRec(){
  if(!rec||rec.stopping||rec.starting) return;
  rec.stopping=true; clearInterval(rec.timer);
  try{rec.mr.requestData&&rec.mr.state==='recording'&&rec.mr.requestData();rec.mr.stop();}catch(e){finishRec();}
}
async function finishRec(){
  const r=rec; rec=null; if(!r||!r.mr){ui();return;}
  clearInterval(r.timer);
  try{r.stream.getVideoTracks().forEach(t=>t.stop());}catch(e){}
  if(r.audio) r.audio.getTracks().forEach(t=>t.stop());
  await sleep(60);                                    // lets the last chunk arrive
  const type=(r.mime||'').split(';')[0]||'video/webm', blob=new Blob(r.chunks,{type});
  if(!blob.size){ui();msg('The recording came out empty. Try again.',4000);return;}
  const meta={id:uid(),ts:Date.now(),look:r.rcp.look,name:r.name,rcp:r.rcp,thumb:r.thumb,fav:false,w:r.w,h:r.h,kind:'video',dur:Math.max(1,Math.round((Date.now()-r.t0)/1000)),ext:type.indexOf('mp4')>=0?'mp4':'webm',roll:null,hidden:false,orig:false};
  await DB.put(meta,{id:meta.id,out:blob}); shots.unshift(meta); S.count++; saveSettings(); ui(); msg('Video saved to your roll',3000);
}
const durText=t=>Math.floor(t/60)+':'+p2(t%60);
const meterCanvas=mkCanvas(64,64);
function meter(x,y){
  try{
    const c=meterCanvas.getContext('2d',{willReadFrequently:true}); c.drawImage(video,0,0,64,64);
    const r=6, cx=Math.round(x*63), cy=Math.round(y*63), x0=clamp(cx-r,0,63), y0=clamp(cy-r,0,63), w=Math.min(64-x0,2*r+1), h=Math.min(64-y0,2*r+1);
    const d=c.getImageData(x0,y0,w,h).data; let s=0;
    for(let i=0;i<d.length;i+=4) s+=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255;
    const mean=s/(d.length/4);
    return Math.round(clamp(Math.log2(0.45/Math.max(mean,0.03))*0.7,-1.5,1.5)*10)/10;
  }catch(e){return 0;}
}
/* focus box with an exposure slider beside it, as on a phone camera: tap to place it, slide up or down to brighten or darken */
let focTimer=0, focAt=null, evDrag=null, evEnd=0;
const evText=v=>(v>0?'+':v<0?'\u2212':'')+Math.abs(v).toFixed(1);
function evPaint(){$('#foc').style.setProperty('--ev',userEV.toFixed(2));$('#evTxt').textContent=evText(userEV);}
function holdReticle(){clearTimeout(focTimer);focTimer=setTimeout(()=>{if(!evDrag||!evDrag.on)$('#foc').hidden=true;},2600);}
function showReticle(px,py){
  const f=$('#foc'), b=view.getBoundingClientRect(); if(!b.width) return;
  if(px==null){px=(focAt?focAt[0]:0.5)*b.width;py=(focAt?focAt[1]:0.5)*b.height;}   // no tap yet: the middle of the picture
  else{f.hidden=true;void f.offsetWidth;}                                          // a fresh tap replays the box animation
  focAt=[px/b.width,py/b.height];
  f.style.left=px+'px'; f.style.top=py+'px'; f.classList.toggle('flip',px>b.width-96); f.hidden=false; evPaint(); holdReticle();
}
function setEV(v){v=Math.round(clamp(v,-2,2)*10)/10;if(v===userEV)return;userEV=v;evPaint();ui();requestDraw();}
function evReady(){return SRC.kind==='sample'&&!busyN&&(liveReady()||!(booting||camOK));}
function evStart(x,y){evDrag=evReady()?{x,y,ev:userEV,on:false}:null;}
function evMove(x,y){
  if(!evDrag) return false;
  if(!evDrag.on){
    const dx=x-evDrag.x, dy=y-evDrag.y; if(Math.abs(dy)<10||Math.abs(dy)<Math.abs(dx)) return false;
    evDrag.on=true; evDrag.y=y; if($('#foc').hidden) showReticle(); clearTimeout(focTimer); $('#foc').classList.add('drag');
  }
  setEV(evDrag.ev-(y-evDrag.y)/80); return true;   // 80 px of travel per stop
}
function evStop(){
  if(evDrag&&evDrag.on){evEnd=Date.now();$('#foc').classList.remove('drag');holdReticle();}
  evDrag=null;
}
async function focusAt(x,y){
  let hw=false;
  try{
    const tr=live.stream&&live.stream.getVideoTracks()[0];
    if(tr&&tr.getCapabilities&&tr.applyConstraints){
      const caps=tr.getCapabilities(), sup=(navigator.mediaDevices.getSupportedConstraints&&navigator.mediaDevices.getSupportedConstraints())||{};
      if(sup.pointsOfInterest&&caps.focusMode&&caps.focusMode.length){
        const mode=caps.focusMode.indexOf('single-shot')>=0?'single-shot':caps.focusMode.indexOf('continuous')>=0?'continuous':caps.focusMode[0];
        await tr.applyConstraints({advanced:[{pointsOfInterest:[{x,y}],focusMode:mode}]}); hw=true;
      }
    }
  }catch(e){hw=false;}
  tapEV=hw?0:meter(x,y);   // where the browser cannot move the focus point, the tap still meters exposure there
  ui(); requestDraw();
}
let pinch=null, pinchEnd=0, zoomSave=0;
function setZoom(z){
  z=Math.round(clamp(z,1,5)*10)/10;
  if(z!==S.zoom){S.zoom=z;if(SRC.kind==='photo')SRC.saved=false;ui();requestDraw();}
  clearTimeout(zoomSave); zoomSave=setTimeout(saveSettings,400);
}
function onViewTap(ev){
  if(running||pinch||Date.now()-pinchEnd<450||Date.now()-evEnd<350||!evReady()) return;
  const b=view.getBoundingClientRect(), L=lastR; if(!b.width) return;
  userEV=0; showReticle(ev.clientX-b.left,ev.clientY-b.top);   // a new point starts from zero compensation, like the phone camera
  if(!liveReady()||!L){tapEV=0;ui();requestDraw();return;}
  const cx=(ev.clientX-b.left)/b.width*view.width, cy=(ev.clientY-b.top)/b.height*view.height;
  const u=clamp((cx-L.m[0])/L.W,0,1), v=clamp((cy-L.m[1])/L.H,0,1);
  focusAt(clamp(u*L.c1[0]+L.c1[2],0,1),clamp(v*L.c1[1]+L.c1[3],0,1));
}
function onOri(e){
  if(e.beta==null||e.gamma==null) return; gotOri=true;
  const b=e.beta*Math.PI/180, g=e.gamma*Math.PI/180, ux=-Math.cos(b)*Math.sin(g), uy=Math.sin(b), uz=Math.cos(b)*Math.cos(g);
  const n=$('#lvl'), t=$('#lvlDeg');
  if(Math.abs(uz)>0.9){n.classList.add('flat');n.classList.remove('ok');t.textContent='FLAT';return;}
  const roll=Math.atan2(ux,uy)*180/Math.PI, rel=((roll+45)%90+90)%90-45;   // tilt from the nearest upright or sideways hold
  n.classList.remove('flat'); n.classList.toggle('ok',Math.abs(rel)<1);
  n.style.setProperty('--a',rel.toFixed(1)+'deg'); t.textContent=(rel>0?'+':'')+rel.toFixed(1)+'\u00B0';
}
async function setLevel(on){
  window.removeEventListener('deviceorientation',onOri);
  if(!on){levelOn=false;ui();if(sheetName==='more')openSheet('more');return;}
  try{
    if(typeof DeviceOrientationEvent==='undefined') throw new Error('none');
    if(typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw new Error('denied');}
    levelOn=true; gotOri=false; $('#lvlDeg').textContent=''; window.addEventListener('deviceorientation',onOri);
    setTimeout(()=>{if(levelOn&&!gotOri){setLevel(false);msg('No motion sensor answered, so the level is off.',4200);}},1800);
  }catch(e){levelOn=false;msg('The level needs motion access, which is not available here.',4200);}
  ui(); if(sheetName==='more')openSheet('more');
}

/* ---------- sheets ---------- */
function slider(id,label,min,max,step,val,fmt,on,origin,def){
  const out=el('output',{text:fmt(val),for:id});
  const inp=el('input',{type:'range',id,min,max,step,value:val,'aria-label':label});
  const box=el('div',{class:'sl'},el('label',{class:'lab',for:id,text:label}),out,inp);
  const o=origin==null?min:origin, pc=v=>clamp((v-min)/(max-min)*100,0,100).toFixed(1)+'%';
  const fill=v=>{inp.style.setProperty('--a',pc(Math.min(o,v)));inp.style.setProperty('--b',pc(Math.max(o,v)));if(def!=null)box.classList.toggle('moved',Math.abs(v-def)>1e-6);}; fill(val);
  inp.addEventListener('input',()=>{const v=+inp.value;out.textContent=fmt(v);fill(v);on(v);});
  return box;
}
function chips(id,label,opts,val,on){
  const seg=opts.length<=5&&!opts.some(o=>o[2])&&opts.reduce((n,o)=>n+String(o[1]).length,0)<=24;
  const wrap=el('div',{class:'chips'+(seg?' seg':''),role:'group','aria-label':label});
  opts.forEach(o=>{

  info.append(el('div',{text:fmtDay(m.ts)+' \u00B7 '+p2(d.getHours())+':'+p2(d.getMinutes())}),el('div',{text:m.w+' \u00D7 '+m.h+(isVid?' \u00B7 '+durText(m.dur||0)+' video':'')+(bits.length?' \u00B7 '+bits.join(' \u00B7 '):'')}));
  const act=$('#detAct'); act.textContent='';
  const tile=(ic,label,fn,cls)=>el('button',{type:'button',class:'act'+(cls?' '+cls:''),onclick:fn},icon(ic),el('span',{text:label}));
  const saving=async(btn,blob,name)=>{btn.disabled=true;try{saveMsg(await saveBlob(blob,name));}finally{btn.disabled=false;}};
  const save=el('button',{type:'button',class:'btn',onclick:()=>saving(save,b.out,fname(m))},icon('down'),isVid?'Save video':'Save photo');
  const acts=el('div',{class:'acts'});
  if(b.a){
    const orig=tile('image','Original',()=>saving(orig,b.a,fname(m,'-original'))); orig.setAttribute('aria-label','Save the original photo');
    const redo=tile('sliders','Redevelop',async()=>{
      try{const a=await loadFile(b.a), bb=b.b?await loadFile(b.b):null;
        applyRecipe(m.rcp); S.mode='photo'; pair=null;
        SRC={kind:'photo',a,b:bb,seed:m.rcp.seed,saved:true}; saveSettings(); closeDetail(true); galOpen=false; hide($('#gal')); ui(); requestDraw(); msg('Change the look, then save it as a new photo.',4600);
      }catch(e){toast('The original could not be opened.');}
    }); redo.setAttribute('aria-label','Develop again with a different look');
    acts.append(orig,redo);
  }
  const fav=tile('heart','Favourite',async()=>{m.fav=!m.fav;await DB.put(m,null);setFav();});
  const setFav=()=>{fav.classList.toggle('on',m.fav);fav.setAttribute('aria-pressed',m.fav?'true':'false');fav.lastChild.textContent=m.fav?'Favourited':'Favourite';}; setFav();
  let armed=0;
  const del=tile('trash','Delete',async()=>{
    if(Date.now()-armed>3500){armed=Date.now();del.lastChild.textContent='Tap again';del.classList.add('warn');setTimeout(()=>{if(del.isConnected&&Date.now()-armed>=3400){del.lastChild.textContent='Delete';del.classList.remove('warn');}},3500);return;}
    await DB.del(id); shots=shots.filter(s=>s.id!==id); closeDetail(); ui();
  },'danger');
  acts.append(fav,del); act.append(save,acts);
  detTok++; detOpen=true; show($('#det')); $('#detBack').focus();
}
function closeDetail(skip){
  if(!detOpen) return; detOpen=false; detId=null; const t=++detTok;
  try{$('#detVid').pause();}catch(e){}
  hide($('#det'),()=>{
    if(t!==detTok||detOpen) return;
    $('#detImg').removeAttribute('src'); try{const v=$('#detVid');v.removeAttribute('src');v.load();}catch(e){}
    if(detUrl){URL.revokeObjectURL(detUrl);detUrl=null;}
  });
  if(!skip) renderGallery();
}

/* ---------- wiring ---------- */
function setMode(m){
  if(S.mode===m) return; if(rec) stopRec(); S.mode=m; pair=null; booth=[];
  if(SRC.kind==='held'||SRC.kind==='result') SRC=sampleSrc();
  saveSettings(); ui(); requestDraw();
}
function boot(){
  if(!E){setMsg('This browser has graphics acceleration off, so photos cannot be developed here.');return;}
  [1,2,3,5].forEach(z=>$('#zoomc').append(el('button',{type:'button','data-z':z,'aria-label':'Zoom '+z+' times','aria-pressed':'false',text:String(z),onclick:()=>setZoom(z)})));
  loadSettings(); buildCams(); ui(); centerCam();
  $('#shutter').onclick=onShutter;
  $('#galImport').onclick=importPhotos;
  fileCam.addEventListener('change',()=>onFiles(fileCam,'camera'));
  fileLib.addEventListener('change',()=>onFiles(fileLib,'import'));
  $('#flipBtn').onclick=async()=>{tapEV=0;userEV=0;$('#foc').hidden=true;S.facing=S.facing==='user'?'environment':'user';saveSettings();if(live.on){dropLive();await startLive();}msg(S.facing==='user'?'Front camera':'Back camera');};
  $('#mPhoto').onclick=()=>setMode('photo'); $('#mVideo').onclick=()=>setMode('video'); $('#mBooth').onclick=()=>setMode('booth');
  $('#rollBtn').onclick=()=>{if(rec)stopRec();openGallery();}; $('#galBack').onclick=closeGallery; $('#detBack').onclick=()=>closeDetail();
  $('#selBtn').onclick=()=>setSelect(!selMode);
  $('#selSave').onclick=exportSel; $('#selDel').onclick=deleteSel;
  $('#selAll').onclick=()=>{
    if(selVis.length&&selVis.every(id=>sel.has(id))) selVis.forEach(id=>{sel.delete(id);selFiles.delete(id);});
    else selVis.forEach(id=>{if(!sel.has(id)){sel.add(id);prepFile(id);}});
    renderGallery();
  };
  $('#tabAll').onclick=()=>{galTab='all';renderGallery();}; $('#tabFav').onclick=()=>{galTab='fav';renderGallery();};
  $('#sheetDone').onclick=closeSheet;
  $('#flashBtn').onclick=()=>{S.flash.on=!S.flash.on;changed();msg(S.flash.on?'Flash on':'Flash off',1300);};
  $('#adjBtn').onclick=()=>{if(sheetName&&sheetName!=='more')closeSheet();else openSheet(lastAdj);};
  $('#moreBtn').onclick=()=>{if(sheetName==='more')closeSheet();else openSheet('more');};
  $('#saveLook').onclick=saveLook;
  $('#sbBtn').onclick=()=>{wantLive=true;startLive().then(()=>ui());ui();};
  $('#closePhoto').onclick=()=>{pair=null;booth=[];SRC=sampleSrc();ui();requestDraw();};
  $('#gridBtn').onclick=()=>{S.grid=!S.grid;changed(true);};
  $('#levelBtn').onclick=()=>setLevel(!levelOn);
  $('#aeBtn').onclick=()=>{tapEV=0;userEV=0;$('#foc').hidden=true;ui();requestDraw();};
  view.addEventListener('click',onViewTap);
  const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  stage.addEventListener('touchstart',e=>{
    if(e.touches.length===2){evStop();pinch={d:Math.max(1,tdist(e.touches)),z:S.zoom};e.preventDefault();}
    else if(e.touches.length===1) evStart(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:false});
  stage.addEventListener('touchmove',e=>{
    if(pinch&&e.touches.length===2){e.preventDefault();setZoom(pinch.z*tdist(e.touches)/pinch.d);}
    else if(!pinch&&e.touches.length===1&&evMove(e.touches[0].clientX,e.touches[0].clientY)) e.preventDefault();
  },{passive:false});
  const endPinch=e=>{if(pinch&&e.touches.length<2){pinch=null;pinchEnd=Date.now();}if(!e.touches.length)evStop();};
  stage.addEventListener('mousedown',e=>{if(e.button===0)evStart(e.clientX,e.clientY);});
  window.addEventListener('mousemove',e=>{if(evDrag)evMove(e.clientX,e.clientY);});
  window.addEventListener('mouseup',evStop);
  stage.addEventListener('touchend',endPinch); stage.addEventListener('touchcancel',endPinch);
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(detOpen)closeDetail();else if(galOpen&&selMode)setSelect(false);else if(galOpen)closeGallery();else if(sheetName)closeSheet();}
  });
  if(window.ResizeObserver) new ResizeObserver(()=>{fitKey='';requestDraw();}).observe(screen); else window.addEventListener('resize',()=>{fitKey='';requestDraw();});
  window.addEventListener('pagehide',()=>{if(live.on)dropLive();});
  window.addEventListener('pageshow',e=>{if(e.persisted&&wantLive&&camOK&&!live.on)startLive(true);});
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState!=='visible'||!wantLive||!camOK) return;
    const tr=live.stream&&live.stream.getVideoTracks()[0];
    if(live.on&&tr&&tr.readyState!=='ended'){if(video.paused)video.play().catch(()=>{});return;}
    if(live.on)dropLive(); startLive(true);
  });
  if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('20px VT323')]).then(()=>{requestDraw();centerCam();},()=>{});}
  DB.open().then(()=>DB.all()).then(all=>{shots=(all||[]).filter(s=>s&&s.id&&s.thumb).sort((a,b)=>b.ts-a.ts);ui();});
  startLive(true).then(ok=>{booting=false;if(!ok)wantLive=false;ui();requestDraw();});
  requestAnimationFrame(loop);
}
boot();
})();

</script>
</body>
</html>
