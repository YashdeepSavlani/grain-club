<title>Grain Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Layout: an iOS-style camera. The picture leads; controls are translucent circles and capsules that stay out of its way.
   Clarity, deference, depth: system type, true black, one yellow accent for whatever is active. */
:root{
  color-scheme:dark;
  --bg:#000; --bg2:#1d1d1f; --bg3:#2c2c2e;
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.4); --seg:#636366; --sep:rgba(84,84,88,.65);
  --text:#f5f5f7; --text2:#98989d;
  --accent:#ffd60a; --on-accent:#000; --green:#30d158; --red:#ff453a; --ok:#30d158;
  --glass:rgba(30,30,32,.62);
  --ease:cubic-bezier(.25,.1,.25,1);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation;transition:transform .2s var(--ease),background-color .2s var(--ease),color .2s var(--ease),opacity .2s var(--ease)}
button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
svg{display:block}
.ic{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#app{position:relative;width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;padding:6px 12px 8px;flex:none}
.ib{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--fill);color:var(--text)}
.ib.on{background:var(--accent);color:var(--on-accent)}
.ctx{flex:1;min-width:0;margin:0;text-align:center;font-size:13px;line-height:1.25;color:var(--text2)}
.ctx.rec{flex:0 1 auto;margin-inline:auto;padding:4px 10px;border-radius:8px;background:var(--red);color:#fff;font-weight:600;font-variant-numeric:tabular-nums}

/* viewfinder */
.vf{position:relative;flex:1 1 0;min-height:150px;margin:0 8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;line-height:0;flex:none;touch-action:none}
#view{display:block;border-radius:18px;cursor:crosshair}
.gridl{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 0 1px rgba(0,0,0,.8));background:
  linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)) 33.333% 0/1px 100% no-repeat,
  linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)) 66.666% 0/1px 100% no-repeat,
  linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)) 0 33.333%/100% 1px no-repeat,
  linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)) 0 66.666%/100% 1px no-repeat}
.flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:18px}
.flashfx.go{animation:fl .4s var(--ease)}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.lvl{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lvl::before,.lvl::after{content:"";position:absolute;top:calc(50% - 1px);width:9%;height:2px;background:var(--text);box-shadow:0 0 2px #000}
.lvl::before{left:7%}.lvl::after{right:7%}
.lvl i{display:block;width:58%;height:2px;background:var(--text);box-shadow:0 0 3px #000;transform:rotate(var(--a,0deg));transition:transform .08s linear,background-color .2s var(--ease)}
.lvl.ok i{background:var(--accent)}
.lvl.flat i{opacity:.35}
.lvl b{position:absolute;top:calc(50% + 12px);font-weight:600;font-size:13px;line-height:1;color:var(--text);text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
.lvl.ok b{color:var(--accent)}
.foc{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border:1.5px solid var(--accent);border-radius:4px;box-shadow:0 0 0 .5px rgba(0,0,0,.5);pointer-events:none;animation:focin .3s var(--ease)}
@keyframes focin{0%{transform:scale(1.4);opacity:.3}100%{transform:scale(1);opacity:1}}
.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:140px;color:var(--text);text-shadow:0 2px 24px #000;pointer-events:none;font-variant-numeric:tabular-nums}
.pillb{position:absolute;z-index:2;min-height:36px;padding:0 16px;border-radius:980px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);color:var(--text);font-size:15px;font-weight:600;white-space:nowrap}
.pillb::after{content:"";position:absolute;inset:-4px}
.pillb.go{background:var(--accent);color:var(--on-accent)}
#closePhoto,#aeBtn{left:12px;top:12px}
#saveLook{right:12px;top:12px}
.say{position:absolute;z-index:2;left:50%;bottom:66px;transform:translateX(-50%);max-width:88%;margin:0;padding:8px 14px;border-radius:14px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);color:var(--text);font-size:13px;line-height:1.35;text-align:center;pointer-events:none;animation:fadeUp .25s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.zoomc{position:absolute;z-index:2;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:4px;border-radius:980px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5)}
.zoomc button{position:relative;min-width:36px;height:36px;padding:0 6px;border-radius:18px;background:rgba(0,0,0,.28);color:var(--text);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.zoomc button::after{content:"";position:absolute;inset:-6px -3px}
.zoomc button.on{min-width:46px;background:rgba(0,0,0,.55);color:var(--accent);font-size:14px}

/* cameras */
.cams{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:12px 20px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.cams::-webkit-scrollbar{display:none}
.cam{flex:none;position:relative;height:36px;padding:0 15px;border-radius:18px;background:var(--fill);color:var(--text);font-size:15px;font-weight:500;white-space:nowrap}
.cam::after{content:"";position:absolute;inset:-5px 0}
.cam.on{background:var(--text);color:#000;font-weight:600}
.glab{flex:none;padding:0 2px 0 12px;font-size:13px;color:var(--text2);white-space:nowrap}
.glab:first-child{padding-left:0}

/* modes */
.modes{display:flex;justify-content:center;gap:2px;padding:0 16px;flex:none}
.mode{height:44px;padding:0 14px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text)}
.mode.on{color:var(--accent)}
#app.sheeting .modes{display:none}

/* shutter row */
.fire{display:flex;align-items:center;justify-content:space-between;padding:4px 34px 18px;flex:none}
.thumb{width:52px;height:52px;flex:none;border-radius:11px;background:var(--bg2) center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.shutter{width:76px;height:76px;flex:none;border-radius:50%;border:4px solid #fff;padding:3px}
.shutter:active{transform:none}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .15s var(--ease),border-radius .2s var(--ease),background-color .2s var(--ease)}
.shutter:active i{transform:scale(.9)}
.shutter.busy i{background:var(--accent)}
.shutter.video i{background:var(--red)}
.shutter.video.rec i{border-radius:24%;transform:scale(.5)}
.shutter:focus-visible{outline-offset:5px}
.round{width:52px;height:52px;flex:none;border-radius:50%;background:var(--fill);display:grid;place-items:center}

/* panels take the place of the camera rows, so the whole picture stays visible while adjusting */
.sheet{flex:none;height:48%;min-height:260px;max-height:440px;margin-top:8px;background:var(--bg2);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:sheetUp .32s var(--ease)}
@keyframes sheetUp{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
#app.sheeting .cams,#app.sheeting .fire{display:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:6px auto 0;flex:none}
.shead{display:flex;align-items:center;gap:6px;padding:6px 6px 8px 16px;flex:none}
.tabs,.gtabs{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.tabs{flex:1;min-width:0}
.tab{flex:1;min-width:0;height:32px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}
.tab.on{background:var(--seg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.3)}
h2{flex:1;min-width:0;margin:0;font-size:17px;font-weight:600;text-wrap:balance}
.textbtn{flex:none;min-height:44px;padding:0 12px;font-size:17px;font-weight:600;color:var(--accent);border-radius:10px}
.textbtn.back{font-weight:400}
.textbtn.back::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 28px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sec{margin:8px 0 -8px 16px;font-size:13px;font-weight:400;letter-spacing:.02em;text-transform:uppercase;color:var(--text2)}
.sec:first-child{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.lab{font-size:13px;color:var(--text2)}
.sl{display:grid;grid-template-columns:1fr auto;align-items:baseline;min-width:0}
.sl .lab{font-size:15px;color:var(--text)}
.sl output{font-size:15px;color:var(--text2);font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1;width:100%}
input[type=range]{--p:50%;-webkit-appearance:none;appearance:none;height:32px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--text) var(--p),var(--fill2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;background:#fff;box-shadow:0 .5px 4px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--fill2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--text)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff}
.grp{display:flex;flex-direction:column;gap:8px;min-width:0}
.grp>.lab{padding-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border-radius:20px;background:var(--fill);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.chip.on{background:var(--text);color:#000;font-weight:600}
.chip .dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px rgba(128,128,128,.5)}
.chips.seg{flex-wrap:nowrap;gap:0;padding:2px;border-radius:9px;background:var(--fill)}
.chips.seg .chip{flex:1;min-width:0;min-height:36px;padding:0 6px;border-radius:7px;background:none;font-size:13px;white-space:nowrap}
.chips.seg .chip.on{background:var(--seg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:8px 16px;border-radius:12px;background:var(--bg3);font-size:17px}
.row>span{min-width:0}
.group{display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.group .row{border-radius:0}
.group .row+.row{box-shadow:inset 0 .5px 0 var(--sep)}
.switch{position:relative;width:51px;height:31px;flex:none;border-radius:16px;background:var(--fill2);transition:background-color .25s var(--ease)}
.switch:active{transform:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.btn{min-height:44px;padding:0 20px;border-radius:980px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600}
.btn.lite{background:var(--fill);color:var(--text);font-weight:500}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{margin:0;padding:0 4px;font-size:13px;line-height:1.4;color:var(--text2);-webkit-user-select:text;user-select:text}
.note b{color:var(--text);font-weight:600}
.field{font:inherit;font-size:17px;padding:12px 16px;border-radius:12px;border:0;background:var(--bg3);color:var(--text);min-width:0;width:100%;-webkit-user-select:text;user-select:text}
.field::placeholder{color:var(--text2)}
textarea.field{font-size:13px;min-height:68px;resize:none;word-break:break-all}
.rec{display:flex;align-items:center;gap:8px;padding:8px 4px;box-shadow:inset 0 .5px 0 var(--sep)}
.rec b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}

/* roll and photo view */
.over{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:overIn .3s var(--ease)}
@keyframes overIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.over header{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:44px;padding:0 4px;flex:none}
.over header h2{text-align:center}
.large{margin:0;padding:2px 16px 10px;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em;flex:none}
.gtabs{margin:0 16px 10px;flex:none}
.pill{min-height:44px;padding:0 18px;border-radius:980px;background:var(--fill);color:var(--text);font-size:15px;font-weight:500}
.pill.on{background:var(--text);color:#000;font-weight:600}
.pill.go{background:var(--accent);color:var(--on-accent);font-weight:600}
.pill.warn{background:rgba(255,69,58,.18);color:var(--red)}
.gbody{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 32px;display:flex;flex-direction:column;gap:24px;-webkit-overflow-scrolling:touch}
.card{background:var(--bg2);border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card p{margin:0;flex:1 1 180px;min-width:0;font-size:17px;line-height:1.35}
.card .k{display:block;margin-bottom:2px;font-size:13px;color:var(--text2)}
.day h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.day p{margin:2px 0 10px;font-size:13px;color:var(--text2)}
.gridp{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-radius:12px;overflow:hidden}
.gridp button{aspect-ratio:1;max-width:100%;background:var(--bg2) center/cover no-repeat;position:relative}
.gridp button.fav::after{content:"";position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.gridp button.vid::before{content:"\25B8  " attr(data-dur);position:absolute;left:6px;bottom:6px;padding:2px 7px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.gridp.reveal button{animation:dev 1.4s ease-out}
@keyframes dev{0%{filter:brightness(0) sepia(1)}60%{filter:brightness(.6) sepia(.6)}100%{filter:none}}
.empty{margin:auto;text-align:center;color:var(--text2);font-size:17px;line-height:1.4;max-width:28ch}
.dimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 12px}
.dimg video{max-width:100%;max-height:100%;border-radius:12px;background:#000}
.dimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.dinfo{padding:6px 16px 0;font-size:13px;line-height:1.4;color:var(--text2);flex:none;font-variant-numeric:tabular-nums}
.dact{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 20px;flex:none}
.dact .pill{flex:1 1 auto}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);padding:11px 18px;border-radius:22px;background:rgba(44,44,46,.92);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);color:var(--text);font-size:15px;font-weight:500;line-height:1.3;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="bar">
    <button type="button" class="ib" id="flashBtn" aria-label="Flash" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2.5 5.5 13.5H11l-1 8 7.5-11H12z"/></svg></button>
    <button type="button" class="ib" id="gridBtn" aria-label="Grid" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg></button>
    <button type="button" class="ib" id="levelBtn" aria-label="Level" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12h5.5M16 12h5.5"/><circle cx="12" cy="12" r="3.6"/></svg></button>
    <p class="ctx" id="osdSrc"></p>
    <button type="button" class="ib" id="adjBtn" aria-label="Adjust the look" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    <button type="button" class="ib" id="moreBtn" aria-label="Settings" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></svg></button>
  </header>

  <section class="vf" id="screen" aria-label="Viewfinder">
    <div class="stage" id="stage">
      <canvas id="view" width="300" height="400"></canvas>
      <div class="gridl" id="gridl" hidden></div>
      <div class="flashfx" id="flashfx"></div>
      <div class="lvl" id="lvl" hidden><i></i><b id="lvlDeg"></b></div>
      <div class="foc" id="foc" hidden></div>
    </div>
    <button type="button" class="pillb" id="closePhoto" hidden>Close</button>
    <button type="button" class="pillb" id="aeBtn" hidden aria-label="Clear the exposure point"></button>
    <button type="button" class="pillb go" id="saveLook" hidden>Save</button>
    <div class="big" id="big" hidden></div>
    <p class="say" id="osdMsg" role="status" aria-live="polite" hidden></p>
    <div class="zoomc" id="zoomc" role="group" aria-label="Zoom"></div>
  </section>

  <div class="cams" id="cams" role="group" aria-label="Cameras"></div>
  <div class="modes" role="group" aria-label="Mode">
    <button type="button" class="mode on" id="mPhoto" aria-pressed="true">Photo</button>
    <button type="button" class="mode" id="mVideo" aria-pressed="false">Video</button>
    <button type="button" class="mode" id="mBooth" aria-pressed="false">Booth</button>
  </div>
  <div class="fire">
    <button type="button" class="thumb" id="rollBtn" aria-label="Open your roll"></button>
    <button type="button" class="shutter" id="shutter" aria-label="Take photo"><i></i></button>
    <button type="button" class="round" id="flipBtn" aria-label="Switch camera"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5a8 8 0 0 1 14-2.5l1.5 2M19.5 14.5a8 8 0 0 1-14 2.5L4 15"/><path d="M20.2 4.8v4.4h-4.4M3.8 19.2v-4.4h4.4"/></svg></button>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="grab" aria-hidden="true"></div>
    <div class="shead"><div class="tabs" id="sheetTabs" role="group" aria-label="Adjustments"></div><h2 id="sheetTitle" hidden></h2><button type="button" class="textbtn" id="sheetDone">Done</button></div>
    <div class="sbody" id="sheetBody"></div>
  </div>

  <section class="over" id="gal" hidden aria-label="Your roll">
    <header>
      <button type="button" class="textbtn back" id="galBack">Camera</button>

    <div class="gtabs" role="group" aria-label="Filter">
