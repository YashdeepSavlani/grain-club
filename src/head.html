<title>Grain Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=VT323&display=swap">
<style>
/* Layout: a plain phone camera. The picture fills the screen; one row of camera names and three buttons sit under it.
   Everything else lives in two menus. The chrome is black and paper-white, and the single accent takes the colour of the selected film. */
:root{
  color-scheme:dark;
  --black:#000; --surface:#171615; --raise:#23221f; --line:#36332f;
  --fg:#f4f0e8; --dim:#a69f94; --mute:#756f65;
  --accent:#ff9d1c; --on-accent:#000; --ok:#74ff86; --warn:#ff7466; --rec:#ff453a;
  --f:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-lcd:"VT323","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--black);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.3;display:flex;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
svg{display:block}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

#app{position:relative;width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--black)}

/* top bar */
.bar{display:flex;align-items:center;gap:2px;padding:4px 10px;flex:none}
.ib{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--fg)}
.ib:active{background:var(--raise)}
.ib.on{color:var(--accent)}
.ctx{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--dim);font-variation-settings:"wdth" 90;margin:0}

/* viewfinder */
.vf{position:relative;flex:1 1 0;min-height:150px;margin:0 8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;line-height:0;flex:none;touch-action:none}
#view{display:block;border-radius:14px;cursor:crosshair}
.gridl{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 0 1px rgba(0,0,0,.9));background:
  linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.7)) 33.333% 0/1px 100% no-repeat,
  linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.7)) 66.666% 0/1px 100% no-repeat,
  linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.7)) 0 33.333%/100% 1px no-repeat,
  linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.7)) 0 66.666%/100% 1px no-repeat}
.flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:14px}
.flashfx.go{animation:fl .4s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.lvl{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lvl::before,.lvl::after{content:"";position:absolute;top:calc(50% - 1px);width:9%;height:2px;background:var(--fg);box-shadow:0 0 2px #000}
.lvl::before{left:7%}.lvl::after{right:7%}
.lvl i{display:block;width:58%;height:2px;background:var(--accent);box-shadow:0 0 3px #000;transform:rotate(var(--a,0deg));transition:transform .08s linear}
.lvl.ok i{background:var(--ok);height:3px}
.lvl.flat i{opacity:.35}
.lvl b{position:absolute;top:calc(50% + 12px);font-weight:600;font-size:14px;line-height:1;color:var(--fg);text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
.lvl.ok b{color:var(--ok)}
.foc{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border:1.5px solid var(--accent);border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none;animation:focin .28s ease-out}
@keyframes focin{0%{transform:scale(1.45);opacity:.3}100%{transform:scale(1);opacity:1}}
.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:140px;color:var(--fg);text-shadow:0 2px 24px #000;pointer-events:none;font-variant-numeric:tabular-nums}
.pillb{position:absolute;z-index:2;padding:8px 15px;min-height:36px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(244,240,232,.28);color:var(--fg);font-size:14px;font-weight:600;white-space:nowrap}
.pillb.go{background:var(--accent);color:var(--on-accent);border-color:transparent}
#closePhoto{left:10px;top:10px}
#aeBtn{left:10px;top:10px}
#saveLook{right:10px;top:10px}
.say{position:absolute;z-index:2;left:50%;bottom:58px;transform:translateX(-50%);max-width:88%;margin:0;padding:7px 13px;border-radius:14px;background:rgba(0,0,0,.66);color:var(--fg);font-size:13.5px;line-height:1.3;text-align:center;pointer-events:none}
.zoomc{position:absolute;z-index:2;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;padding:2px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(244,240,232,.22)}
.zoomc button{min-width:38px;height:34px;border-radius:17px;color:var(--fg);font-size:20px;line-height:1;font-weight:400}
.zoomc #zoomVal{min-width:52px;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.zoomc button:disabled{opacity:.3;cursor:default}
.zoomc button:active:not(:disabled){background:rgba(255,255,255,.14)}

/* cameras: one line of names */
.cams{display:flex;align-items:center;overflow-x:auto;padding:8px 22px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 26px),transparent)}
.cams::-webkit-scrollbar{display:none}
.cam{flex:none;position:relative;padding:12px 10px 9px;border-radius:8px;font-size:15px;font-weight:450;color:var(--dim);font-variation-settings:"wdth" 86;white-space:nowrap}
.cam.on{color:var(--fg);font-weight:680}
.cam.on::before{content:"";position:absolute;left:50%;top:3px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--accent)}
.glab{flex:none;display:flex;align-items:center;gap:8px;padding:12px 4px 9px 18px;font-size:13px;color:var(--mute);white-space:nowrap;font-variation-settings:"wdth" 86}
.glab::after{content:"";width:12px;height:1px;background:var(--line)}
.glab:first-child{padding-left:0}

/* modes */
.modes{display:flex;justify-content:center;gap:4px;padding:2px 16px 0;flex:none}
.mode{padding:8px 12px;border-radius:8px;font-size:14px;font-weight:450;color:var(--mute);font-variation-settings:"wdth" 90}
.mode.on{color:var(--fg);font-weight:680}
#app.sheeting .modes{display:none}
.ctx.rec{color:var(--rec);font-weight:650;font-variant-numeric:tabular-nums}

/* shutter row */
.fire{display:flex;align-items:center;justify-content:space-between;padding:10px 36px 16px;flex:none}
.thumb{width:48px;height:48px;flex:none;border-radius:12px;background:var(--surface) center/cover no-repeat;box-shadow:inset 0 0 0 1px var(--line)}
.shutter{width:74px;height:74px;flex:none;border-radius:50%;border:3px solid var(--fg);padding:4px}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:var(--fg);transition:transform .08s,background .15s}
.shutter:active i{transform:scale(.9)}
.shutter.busy i{background:var(--accent)}
.shutter.video i{background:var(--rec);transform:scale(.86);transition:transform .15s,border-radius .15s}
.shutter.video.rec i{border-radius:24%;transform:scale(.5)}
.shutter:focus-visible{outline-offset:5px}
.round{width:48px;height:48px;flex:none;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.round:active{background:var(--raise)}

/* panels take the place of the camera row, so the whole picture stays visible while adjusting */
.sheet{flex:none;height:46%;min-height:250px;max-height:430px;margin-top:8px;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column}
#app.sheeting .cams,#app.sheeting .fire{display:none}
.shead{display:flex;align-items:center;gap:4px;padding:8px 6px 2px 8px;flex:none}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 8px 9px;font-size:15px;color:var(--dim);white-space:nowrap;font-variation-settings:"wdth" 90;box-shadow:inset 0 -2px 0 transparent}
.tab.on{color:var(--fg);font-weight:680;box-shadow:inset 0 -2px 0 var(--accent)}
h2{flex:1;min-width:0;margin:0;padding:0 8px;font-size:16px;font-weight:680;text-wrap:balance}
.textbtn{flex:none;padding:10px 12px;font-size:15px;font-weight:650;color:var(--accent);border-radius:8px}
.textbtn.back{color:var(--fg);font-weight:500}
.textbtn.back::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-left:1.7px solid currentColor;border-bottom:1.7px solid currentColor;transform:rotate(45deg) translateY(-1px)}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:10px 16px 20px;display:flex;flex-direction:column;gap:15px;-webkit-overflow-scrolling:touch}
.sec{margin:6px 0 -4px;font-size:16px;font-weight:680}
.sec:first-child{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.lab{font-size:13.5px;color:var(--dim)}
.sl{display:grid;grid-template-columns:1fr auto;align-items:baseline;min-width:0}
.sl output{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1;width:100%}
input[type=range]{--p:50%;-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(to right,var(--fg) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;border-radius:50%;background:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:2px;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--fg)}
.grp{display:flex;flex-direction:column;gap:7px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 14px;min-height:38px;border-radius:999px;border:1px solid var(--line);font-size:14.5px;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--fg);color:#000;border-color:var(--fg);font-weight:620}
.chip .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px rgba(128,128,128,.5)}
.btn{padding:9px 16px;min-height:40px;border-radius:999px;background:var(--fg);color:#000;font-size:14.5px;font-weight:650}
.btn.lite{background:none;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13.5px;color:var(--dim);line-height:1.4;margin:0;-webkit-user-select:text;user-select:text}
.note b{color:var(--fg);font-weight:600}
.field{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--fg);min-width:0;width:100%;-webkit-user-select:text;user-select:text}
textarea.field{font-size:13px;min-height:64px;resize:none;word-break:break-all}
.rec{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.rec b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}

/* roll and photo view */
.over{position:absolute;inset:0;z-index:20;background:var(--black);display:flex;flex-direction:column}
.over header{display:flex;align-items:center;gap:4px;padding:4px 6px;flex:none}
.over header h2{text-align:center}
.gtabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);flex:none}
.pill{padding:9px 15px;min-height:40px;border:1px solid var(--line);border-radius:999px;font-size:14.5px;font-weight:500;color:var(--fg)}
.pill.on{background:var(--fg);color:#000;border-color:var(--fg);font-weight:620}
.pill.go{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:650}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.gbody{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:20px;-webkit-overflow-scrolling:touch}
.card{background:var(--surface);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card p{margin:0;flex:1 1 180px;min-width:0;font-size:15px;line-height:1.35;color:var(--fg)}
.card .k{display:block;font-size:13px;color:var(--dim);margin-bottom:2px}
.day h3{margin:0;font-size:16px;font-weight:680}
.day p{margin:1px 0 9px;font-size:13.5px;color:var(--dim)}
.gridp{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.gridp button{aspect-ratio:1;max-width:100%;background:var(--surface) center/cover no-repeat;border-radius:4px;position:relative}
.gridp button.fav::after{content:"";position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.gridp button.vid::before{content:"\25B8  " attr(data-dur);position:absolute;left:5px;bottom:5px;padding:2px 7px;border-radius:9px;background:rgba(0,0,0,.68);color:var(--fg);font-size:12px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.gridp.reveal button{animation:dev 1.4s ease-out}
@keyframes dev{0%{filter:brightness(0) sepia(1)}60%{filter:brightness(.6) sepia(.6)}100%{filter:none}}
.empty{margin:auto;text-align:center;color:var(--dim);font-size:15px;line-height:1.45;max-width:30ch}
.dimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 12px}
.dimg video{max-width:100%;max-height:100%;border-radius:6px;background:#000}
.dimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.dinfo{padding:4px 16px 0;font-size:13.5px;line-height:1.35;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.dact{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 18px;flex:none}
.dact .pill{flex:1 1 auto}
.toast{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:40;background:var(--fg);color:#000;padding:11px 14px;border-radius:14px;font-weight:600;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.6)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="bar">
    <button type="button" class="ib" id="flashBtn" aria-label="Flash" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2.5 5.5 13.5H11l-1 8 7.5-11H12z"/></svg></button>
    <button type="button" class="ib" id="gridBtn" aria-label="Grid" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg></button>
    <button type="button" class="ib" id="levelBtn" aria-label="Level" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12h5.5M16 12h5.5"/><circle cx="12" cy="12" r="3.6"/></svg></button>
    <p class="ctx" id="osdSrc"></p>
    <button type="button" class="ib" id="adjBtn" aria-label="Adjust the look" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    <button type="button" class="ib" id="moreBtn" aria-label="Settings" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg></button>
  </header>

  <section class="vf" id="screen" aria-label="Viewfinder">
    <div class="stage" id="stage">
      <canvas id="view" width="300" height="400"></canvas>
      <div class="gridl" id="gridl" hidden></div>
      <div class="flashfx" id="flashfx"></div>
      <div class="lvl" id="lvl" hidden><i></i><b id="lvlDeg"></b></div>
      <div class="foc" id="foc" hidden></div>
    </div>
    <button type="button" class="pillb" id="closePhoto" hidden>Close</button>
    <button type="button" class="pillb" id="aeBtn" hidden aria-label="Clear the exposure point"></button>
    <button type="button" class="pillb go" id="saveLook" hidden>Save</button>
    <div class="big" id="big" hidden></div>
    <p class="say" id="osdMsg" role="status" aria-live="polite" hidden></p>
    <div class="zoomc" id="zoomc" role="group" aria-label="Zoom">
      <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
      <button type="button" id="zoomVal" aria-label="Reset zoom to 1x">1.0&times;</button>
      <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
    </div>
  </section>

  <div class="cams" id="cams" role="group" aria-label="Cameras"></div>
  <div class="modes" role="group" aria-label="Mode">
    <button type="button" class="mode on" id="mPhoto" aria-pressed="true">Photo</button>
    <button type="button" class="mode" id="mVideo" aria-pressed="false">Video</button>
    <button type="button" class="mode" id="mBooth" aria-pressed="false">Booth</button>
  </div>
  <div class="fire">
    <button type="button" class="thumb" id="rollBtn" aria-label="Open your roll"></button>
    <button type="button" class="shutter" id="shutter" aria-label="Take photo"><i></i></button>
    <button type="button" class="round" id="flipBtn" aria-label="Switch camera"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5a8 8 0 0 1 14-2.5l1.5 2M19.5 14.5a8 8 0 0 1-14 2.5L4 15"/><path d="M20.2 4.8v4.4h-4.4M3.8 19.2v-4.4h4.4"/></svg></button>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="shead"><div class="tabs" id="sheetTabs" role="group" aria-label="Adjustments"></div><h2 id="sheetTitle" hidden></h2><button type="button" class="textbtn" id="sheetDone">Done</button></div>
    <div class="sbody" id="sheetBody"></div>
  </div>

  <section class="over" id="gal" hidden aria-label="Your roll">
    <header>
      <button type="button" class="textbtn back" id="galBack">Camera</button>
      <h2>Roll</h2>
      <button type="button" class="textbtn" id="galImport">Import</button>
    </header>
    <div class="gtabs">
      <button type="button" class="tab on" id="tabAll" aria-pressed="true">All</button>
      <button type="button" class="tab" id="tabFav" aria-pressed="false">Favourites</button>
    </div>
    <div class="gbody" id="galBody"></div>
  </section>

  <section class="over" id="det" hidden aria-label="Photo">
    <header>
      <button type="button" class="textbtn back" id="detBack">Roll</button>
      <h2 id="detTitle"></h2>
      <span style="width:64px" aria-hidden="true"></span>
    </header>
    <div class="dimg"><img id="detImg" alt="Developed photo"><video id="detVid" controls playsinline hidden></video></div>
    <div class="dinfo" id="detInfo"></div>
    <div class="dact" id="detAct"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="fileCam" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <input type="file" id="fileLib" class="vh" accept="image/*" multiple tabindex="-1" aria-hidden="true">
  <video id="liveVideo" class="vh" playsinline muted autoplay></video>
</div>
